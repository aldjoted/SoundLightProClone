<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart - SoundLightPro</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Stripe.js library -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">SoundLightPro</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cart.html">Cart (<span id="cart-item-count">0</span>)</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div id="auth-links">
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
                <div id="user-info" class="hidden">
                    <span id="username-display"></span>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Your Shopping Cart</h1>
        <div id="cart-container">
            <!-- Cart items and summary will be dynamically inserted here -->
        </div>

        <!-- Checkout Form - Initially hidden -->
        <div id="checkout-section" class="hidden">
            <h2>Checkout</h2>
            
            <div id="checkout-message" class="hidden"></div>
            
            <form id="checkout-form" class="checkout-form">
                <h3>Shipping Information</h3>
                <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
                <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
                <input type="text" id="address" name="address" placeholder="Address" required>
                <input type="text" id="postal_code" name="postal_code" placeholder="Postal Code" required>
                <input type="text" id="city" name="city" placeholder="City" required>

                <h3>Payment Details</h3>
                <label for="card-element">
                  Credit or debit card
                </label>
                <div id="card-element" style="padding: 10px; border: 1px solid #555; border-radius: 4px; background-color: #333;">
                  <!-- A Stripe Element will be inserted here. -->
                </div>
              
                <!-- Used to display form errors. -->
                <div id="card-errors" role="alert" style="color: #ffcccc; margin-top: 10px;"></div>

                <button type="submit" id="submit-payment-btn">Pay Now</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 SoundLightPro. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript files -->
    <script src="js/apiService.js" type="module"></script>
    <script src="js/cart.js" type="module"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
