<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SoundLightPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">SoundLightPro</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cart.html">Cart (<span id="cart-item-count">0</span>)</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div id="auth-links">
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
                <div id="user-info" class="hidden">
                    <span id="username-display"></span>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Create a New Account</h2>
            <form id="register-form" class="auth-form">
                <div id="form-message" class="hidden"></div>
                
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required>
                
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" name="password2" required>
                
                <button type="submit">Register</button>
            </form>
             <p style="text-align: center; margin-top: 1rem;">
                Already have an account? <a href="login.html">Login here</a>.
            </p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 SoundLightPro. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript files -->
    <script src="js/apiService.js" type="module"></script>
    <script src="js/cart.js" type="module"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
