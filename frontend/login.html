<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SoundLightPro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">SoundLightPro</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cart.html">Cart (<span id="cart-item-count">0</span>)</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <div id="auth-links">
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
                <div id="user-info" class="hidden">
                    <span id="username-display"></span>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Login to Your Account</h2>
            <form id="login-form" class="auth-form">
                <div id="form-message" class="hidden"></div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                
                <button type="submit">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Don't have an account? <a href="register.html">Register here</a>.
            </p>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 SoundLightPro. All rights reserved.</p>
        </div>
    </footer>

    <!-- JavaScript files -->
    <script src="js/apiService.js" type="module"></script>
    <script src="js/cart.js" type="module"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/main.js" type="module"></script>

    <script type="module">
        // A small script to handle the success message after registration
        import { showFormMessage } from './js/ui.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('registered') === 'true') {
                showFormMessage('form-message', 'Registration successful! Please log in.', false);
            }
        });
    </script>
</body>
</html>
